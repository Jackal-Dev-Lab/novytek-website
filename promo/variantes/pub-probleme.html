<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pub NovyTek – Le problème</title>
<link href="../fonts.css" rel="stylesheet">
<link href="kit.css" rel="stylesheet">
<style>
  /* Textes repris de https://novytek.fr (section « Pourquoi tant d'entreprises n'ont pas de vrai site » et « La réponse de NovyTek ») */
  body.v #s1t { left: 80px; top: 470px; font-size: 100px; }
  body.v .num { left: 80px; font-size: 200px; line-height: 1; font-weight: 800; letter-spacing: -6px; white-space: nowrap; }
  body.v #s1n1 { top: 610px; }
  body.v #s1n2 { top: 820px; }
  body.v #s1s { left: 80px; right: 80px; top: 1080px; font-size: 46px; line-height: 1.3; font-weight: 600; }

  body.v #s2t { left: 80px; top: 370px; font-size: 104px; }
  body.v #chat { left: 90px; width: 900px; top: 640px; height: 560px; padding: 34px 40px; }
  .chat-head { display: flex; align-items: center; gap: 20px; font-size: 34px; font-weight: 700; color: var(--muted); padding-bottom: 26px; border-bottom: 2px solid var(--line); }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: #1f3355; }
  #bubble { position: absolute; right: 40px; top: 156px; max-width: 680px; background: var(--blue); color: #fff; font-size: 40px; line-height: 1.3; font-weight: 600; padding: 24px 30px; border-radius: 30px 30px 8px 30px; }
  #sent { position: absolute; right: 44px; top: 390px; font-size: 28px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
  #typing { position: absolute; left: 40px; top: 380px; background: #16284a; border-radius: 30px 30px 30px 8px; padding: 22px 26px; display: flex; gap: 12px; }
  #typing i { width: 16px; height: 16px; border-radius: 50%; background: var(--muted); display: block; }
  #noreply { position: absolute; left: 40px; top: 470px; font-size: 36px; color: var(--muted); font-style: italic; font-weight: 500; }
  body.v #s2p { top: 1250px; font-size: 128px; font-weight: 800; letter-spacing: -3px; }

  body.v #s3e { left: 80px; top: 450px; }
  body.v .s3l { left: 80px; right: 60px; font-size: 90px; }
  body.v #s3a { top: 510px; }
  body.v #s3b { top: 640px; }
  body.v #s3c { top: 870px; }

  body.v #s4e { top: 470px; }
  body.v #s4l { top: 540px; font-size: 46px; font-weight: 600; }
  body.v #s4p { top: 590px; font-size: 300px; line-height: 1; font-weight: 800; letter-spacing: -8px; }
  #s4p small { font-family: "Figtree"; font-size: 64px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  body.v #s4s { top: 950px; font-size: 76px; font-weight: 800; letter-spacing: -2px; }
  body.v #s4c { left: 60px; right: 60px; top: 1100px; display: flex; justify-content: center; gap: 20px; }
</style>
</head>
<body>
<div id="stage">
  <!-- 1. Le prix d'un site classique -->
  <div class="scene" id="s1">
    <h1 class="abs title" id="s1t"></h1>
    <div class="abs num big" id="s1n1">0 à</div>
    <div class="abs num big hl" id="s1n2">0 €</div>
    <div class="abs" id="s1s">à sortir <span class="hl">d'un coup</span>,<br><span class="muted">avant d'avoir vu la première ligne.</span></div>
  </div>

  <!-- 2. Après la livraison, plus personne -->
  <div class="scene" id="s2">
    <h2 class="abs title" id="s2t"></h2>
    <div class="abs card" id="chat">
      <div class="chat-head"><div class="avatar"></div>Votre prestataire</div>
      <div id="bubble">Bonjour, mon site ne s'affiche plus… Vous pouvez regarder&nbsp;?</div>
      <div id="sent">Envoyé <span id="sentIc"></span></div>
      <div id="typing"><i></i><i></i><i></i></div>
      <div id="noreply">Aucune réponse.</div>
    </div>
    <div class="abs center big hl" id="s2p">Plus personne.</div>
  </div>

  <!-- 3. La réponse de NovyTek -->
  <div class="scene" id="s3">
    <div class="abs eyebrow" id="s3e">La réponse de NovyTek</div>
    <h2 class="abs title s3l" id="s3a"></h2>
    <h2 class="abs title s3l" id="s3b"></h2>
    <h2 class="abs title s3l" id="s3c"></h2>
  </div>

  <!-- 4. Le prix NovyTek -->
  <div class="scene" id="s4">
    <div class="abs eyebrow center" id="s4e">Formules</div>
    <div class="abs center muted" id="s4l">À partir de</div>
    <div class="abs center big" id="s4p"><span id="s4n">0</span>&nbsp;€<small> /mois</small></div>
    <div class="abs center big" id="s4s">Sans frais de création.</div>
    <div class="abs" id="s4c"></div>
  </div>
</div>

<script src="icons.js"></script>
<script src="kit.js"></script>
<script>
// ---------- Contenu ----------
words("s1t", "Un site pro ?");
words("s2t", "Et après la\nlivraison ?");
words("s3a", "Un abonnement.");
words("s3b", "Un site construit\npour vous.");
words("s3c", "*Le même\ninterlocuteur,\navant comme après.*");
$("sentIc").innerHTML = icon("circle-check", 26, "#9fb3cc", 2.4);
const CHIPS = ["Hébergement compris", "Sans engagement"];
$("s4c").innerHTML = CHIPS.map((c, i) => `<span class="chip" id="c4_${i}">${icon("circle-check", 30, "#7cc6fb", 2.6)}${c}</span>`).join("");

// ---------- Timeline (s) ----------
// 0.0–3.4  « Un site pro ? 2 000 à 4 000 € d'un coup »
// 3.4–6.4  « Et après la livraison ? … Plus personne. »
// 6.4–9.9  « La réponse de NovyTek : un abonnement, un site construit pour vous, le même interlocuteur »
// 9.9–12.5 « À partir de 19 €/mois, sans frais de création »
// 12.5–15  Carton de fin
setup({
  sweeps: [3.4, 6.4, 9.9, 12.5], end: 12.5, cta: "Composer mon site →",
  pad: [["A2", "A3", "C4", "E4", "G4"], ["F2", "F3", "A3", "C4", "E4"], ["C3", "C4", "E4", "G4", "B4"], ["G2", "G3", "B3", "D4", "G4"]],
});

// Voix off (fenêtres dans lesquelles chaque phrase doit tenir)
vo(0.3, 3.35, "Deux à quatre mille euros… d'un coup.");
vo(3.5, 6.35, "Et après la livraison… plus personne.");
vo(6.5, 9.85, "NovyTek : un abonnement, un site construit pour vous.");
vo(10.0, 12.45, "Dès dix-neuf euros par mois, sans frais de création.");
vo(12.65, 14.95, "Rendez-vous sur novytek.fr.");

// Bruitages propres à la variante
sfx("pop", 0.2, { f: 520, gain: -12 });
for (let x = 0.5; x < 1.7; x += 0.08) sfx("tick", x, { gain: -27, pan: 0.2 * Math.sin(x * 9) });
sfx("pop", 1.72, { f: 784, gain: -10 });
sfx("click", 1.9, { f: 2600, gain: -18 });
sfx("pop", 3.6, { f: 520, gain: -13 });
sfx("blip", 4.05, { f: 1318.5, gain: -16 });
[4.62, 4.77, 4.92].forEach((x, i) => sfx("tick", x, { gain: -24, pan: -0.3 }));
sfx("thud", 5.4, { gain: -8 });
[[6.65, 523.25], [7.3, 659.25], [8.15, 783.99]].forEach(([x, f]) => sfx("pop", x, { f, gain: -12 }));
for (let x = 10.1; x < 10.62; x += 0.06) sfx("tick", x, { gain: -27 });
sfx("pop", 10.64, { f: 783.99, gain: -10 });
sfx("click", 11.0, { f: 3000, gain: -20, pan: -0.3 });
sfx("click", 11.15, { f: 3000, gain: -20, pan: 0.3 });

window.renderFrame = function (t) {
  frameCommon(t);

  // 1
  scene("s1", t, 0, 3.45);
  wordsFrame("s1t", t, 0.15, 0.12, 3.1);
  const c1 = eOut(p(t, 0.5, 1.4)), c2 = eOut(p(t, 0.7, 1.7));
  $("s1n1").textContent = fmt(2000 * c1) + " à";
  $("s1n2").textContent = fmt(4000 * c2) + " €";
  inOut("s1n1", t, 0.4, 0.8, 3.05, 3.35, { dy: 80 });
  inOut("s1n2", t, 0.6, 1.0, 3.1, 3.4, { dy: 80 });
  if (t > 1.7 && t < 2.3) $("s1n2").style.transform += ` scale(${1 + 0.06 * Math.sin(p(t, 1.7, 2.3) * Math.PI)})`;
  inOut("s1s", t, 1.75, 2.2, 3.1, 3.4, { dy: 40 });

  // 2
  scene("s2", t, 3.4, 6.45);
  wordsFrame("s2t", t, 3.55, 0.1, 6.1);
  inOut("chat", t, 3.7, 4.1, 6.05, 6.35, { dy: 120 });
  inOut("bubble", t, 3.95, 4.3, 99, 100, { dx: 60, dy: 20, s0: 0.85 });
  inOut("sent", t, 4.25, 4.45, 99, 100, { dy: 10 });
  const ty = t >= 4.5 && t < 5.15;
  st("typing", { opacity: ty ? 1 : 0 });
  [...$("typing").children].forEach((d, i) => st(d, { transform: `translateY(${-8 * Math.max(0, Math.sin((t - 4.5) * 10 - i * 0.9))}px)` }));
  inOut("noreply", t, 5.2, 5.5, 99, 100, { dy: 16 });
  inOut("s2p", t, 5.35, 5.7, 6.1, 6.4, { dy: 0, s0: 0.6 });
  if (t > 5.35 && t < 5.9) $("s2p").style.transform += ` translateX(${10 * Math.sin((t - 5.35) * 60) * (1 - p(t, 5.35, 5.9))}px)`;

  // 3
  scene("s3", t, 6.4, 9.95);
  inOut("s3e", t, 6.5, 6.8, 9.6, 9.9, { dy: 30 });
  wordsFrame("s3a", t, 6.6, 0.12, 9.6);
  wordsFrame("s3b", t, 7.25, 0.1, 9.62);
  wordsFrame("s3c", t, 8.1, 0.1, 9.64);

  // 4
  scene("s4", t, 9.9, 12.55);
  inOut("s4e", t, 10.0, 10.3, 12.2, 12.5, { dy: 30 });
  inOut("s4l", t, 10.05, 10.35, 12.2, 12.5, { dy: 30 });
  $("s4n").textContent = Math.round(19 * eOut(p(t, 10.1, 10.62)));
  inOut("s4p", t, 10.05, 10.45, 12.2, 12.5, { dy: 60, s0: 0.85 });
  inOut("s4s", t, 10.6, 11.0, 12.2, 12.5, { dy: 40 });
  CHIPS.forEach((_, i) => inOut(`c4_${i}`, t, 10.95 + i * 0.15, 11.3 + i * 0.15, 12.2, 12.5, { dy: 30, s0: 0.8 }));
};
window.renderFrame(0);
</script>
</body>
</html>
