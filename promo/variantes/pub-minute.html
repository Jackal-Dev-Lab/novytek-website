<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pub NovyTek – En ligne dans la minute</title>
<link href="../fonts.css" rel="stylesheet">
<link href="kit.css" rel="stylesheet">
<style>
  /* Étapes décrites sur https://novytek.fr/formules (« De la configuration à la mise en ligne ») */
  body.v #ring { left: 360px; top: 380px; width: 360px; height: 360px; }
  body.v #s1t { left: 0; right: 0; text-align: center; top: 800px; font-size: 110px; }
  body.v #s1c { top: 1260px; font-size: 34px; font-weight: 600; }

  body.v #s2e { left: 80px; top: 300px; }
  body.v #steps { left: 80px; top: 360px; width: 920px; }
  .step { height: 110px; margin-bottom: 14px; font-family: "Bricolage Grotesque"; font-size: 50px; font-weight: 800; color: var(--muted); }
  .num { width: 72px; height: 72px; flex: none; border-radius: 50%; border: 3px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 36px; background: var(--bg); }
  body.v #card2 { left: 80px; width: 920px; top: 780px; height: 600px; overflow: hidden; }
  .pane { position: absolute; inset: 0; padding: 40px 44px; }
  .lbl { font-size: 28px; font-weight: 700; color: var(--muted); letter-spacing: 1px; }
  .opt { position: absolute; left: 44px; right: 44px; height: 112px; border-radius: 24px; border: 2px solid var(--line); display: flex; align-items: center; gap: 24px; padding: 0 30px; font-size: 40px; font-weight: 700; }
  .opt .radio { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--muted); flex: none; }
  .opt .pr { margin-left: auto; font-family: "Bricolage Grotesque"; font-weight: 800; }
  .opt .pr small { font-family: "Figtree"; font-size: 26px; color: var(--muted); font-weight: 600; }
  #addr { position: absolute; left: 44px; right: 44px; top: 360px; display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 600; color: var(--text); }
  #addr .tag { margin-left: auto; color: var(--sky); font-weight: 700; }
  #total { position: absolute; left: 44px; right: 44px; top: 450px; padding-top: 28px; border-top: 2px solid var(--line); display: flex; align-items: baseline; font-size: 34px; font-weight: 700; color: var(--muted); }
  #total .v { margin-left: auto; font-family: "Bricolage Grotesque"; font-size: 60px; font-weight: 800; color: var(--text); }
  #payHead { position: absolute; left: 0; right: 0; top: 90px; display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 40px; font-weight: 700; }
  #pay { position: absolute; left: 160px; right: 160px; top: 230px; height: 130px; border-radius: 28px; background: var(--blue); display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 46px; font-weight: 700; color: #fff; box-shadow: 0 30px 60px -24px rgba(27,140,227,.9); }
  #spin { width: 54px; height: 54px; border-radius: 50%; border: 6px solid rgba(255,255,255,.35); border-top-color: #fff; }
  #ok { position: absolute; left: 0; right: 0; top: 400px; display: flex; justify-content: center; align-items: center; gap: 18px; font-size: 44px; font-weight: 800; font-family: "Bricolage Grotesque"; color: var(--sky); }
  #browser { position: absolute; left: 30px; right: 30px; top: 30px; bottom: 30px; border-radius: 24px; background: #fff; overflow: hidden; }
  #bar { position: absolute; left: 0; right: 0; top: 0; height: 90px; background: #eef2f7; display: flex; align-items: center; gap: 12px; padding: 0 24px; }
  #bar i { width: 18px; height: 18px; border-radius: 50%; display: block; }
  #urlf { margin-left: 16px; flex: 1; height: 56px; border-radius: 28px; background: #fff; display: flex; align-items: center; gap: 12px; padding: 0 22px; font-size: 30px; font-weight: 600; color: #0a1734; white-space: nowrap; overflow: hidden; }
  #caret { width: 3px; height: 34px; background: #1b8ce3; }
  #live { position: absolute; right: 26px; top: 116px; display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px; background: #0a1734; color: #fff; font-size: 26px; font-weight: 700; }
  #live b { width: 14px; height: 14px; border-radius: 50%; background: #3ecf7a; display: block; }

  body.v #s3t { left: 80px; top: 430px; font-size: 100px; }
  body.v #s3c { left: 60px; right: 60px; top: 730px; display: flex; flex-wrap: wrap; gap: 20px; }
  #s3c .chip { font-size: 40px; padding: 22px 36px; }
  body.v #s3a { left: 80px; top: 1040px; font-size: 80px; font-weight: 800; letter-spacing: -2px; }
  body.v #s3b { left: 80px; top: 1150px; font-size: 40px; font-weight: 600; }
</style>
</head>
<body>
<div id="stage">
  <!-- 1. Accroche -->
  <div class="scene" id="s1">
    <svg class="abs" id="ring" viewBox="0 0 360 360">
      <g id="ticks"></g>
      <circle cx="180" cy="180" r="160" fill="none" stroke="#1b304c" stroke-width="14"/>
      <circle id="prog" cx="180" cy="180" r="160" fill="none" stroke="#7cc6fb" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 180 180)"/>
      <g transform="translate(105 105) scale(3.125)"><path d="M31 6h9v36h-9z" fill="#0b4f96"/><path d="M8 6h9l23 36h-9z" fill="#7cc6fb"/><path d="M31 42h9l-5.8-9.1z" fill="#0b4f96" opacity=".55"/><path d="M8 6h9v36H8z" fill="#1b8ce3"/><path d="M17 6v14.1L8 6z" fill="#7cc6fb" opacity=".35"/></g>
    </svg>
    <h1 class="abs title" id="s1t"></h1>
    <div class="abs center muted" id="s1c">Dès le paiement validé · formules Vitrine et Boutique</div>
  </div>

  <!-- 2. Trois étapes -->
  <div class="scene" id="s2">
    <div class="abs eyebrow" id="s2e">De la configuration à la mise en ligne</div>
    <div class="abs" id="steps"></div>
    <div class="abs card" id="card2">
      <div class="pane" id="pane0">
        <div class="lbl">VOTRE FORMULE</div>
        <div class="opt" id="o0" style="top:96px"><div class="radio"></div>Vitrine<span class="pr">19 €<small> /mois</small></span></div>
        <div class="opt" id="o1" style="top:224px"><div class="radio"></div>Boutique<span class="pr">29 €<small> /mois</small></span></div>
        <div id="addr"><span id="globe"></span>votre-entreprise.novytek.fr<span class="tag">inclus</span></div>
        <div id="total">Total<span class="v" id="totv">— €</span></div>
      </div>
      <div class="pane" id="pane1">
        <div id="payHead"><span id="lockIc"></span>Paiement sécurisé</div>
        <div id="pay"><span id="payIn">Payer 19 €</span></div>
        <div id="ok"><span id="okIc"></span>Paiement validé</div>
      </div>
      <div class="pane" id="pane2" style="padding:0">
        <div id="browser">
          <div id="bar"><i style="background:#f26b5b"></i><i style="background:#f5bf4f"></i><i style="background:#3ecf7a"></i>
            <div id="urlf"><span id="urlt"></span><span id="caret"></span></div></div>
          <div id="page">
            <div class="sk" id="pg0" style="left:24px;top:110px;right:24px;height:170px;border-radius:18px;background:#1b8ce3"></div>
            <div class="sk" id="pg1" style="left:24px;top:300px;width:420px;height:22px;background:#9aa6b8"></div>
            <div class="sk" id="pg2" style="left:24px;top:338px;width:300px;height:18px;background:#c5cdd8"></div>
            <div class="sk" id="pg3" style="left:24px;top:382px;width:250px;height:110px;border-radius:14px;background:#dde4ec"></div>
            <div class="sk" id="pg4" style="left:290px;top:382px;width:250px;height:110px;border-radius:14px;background:#cfd8e3"></div>
            <div class="sk" id="pg5" style="left:556px;top:382px;width:250px;height:110px;border-radius:14px;background:#dde4ec"></div>
          </div>
          <div id="live"><b></b>En ligne</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. Vous le rendez vôtre -->
  <div class="scene" id="s3">
    <h2 class="abs title" id="s3t"></h2>
    <div class="abs" id="s3c"></div>
    <div class="abs big" id="s3a">Sans code.</div>
    <div class="abs muted" id="s3b">Sans engagement, résiliable en un clic.</div>
  </div>
</div>

<script src="icons.js"></script>
<script src="kit.js"></script>
<script>
// ---------- Contenu ----------
words("s1t", "Votre site\nen ligne\n*dans la minute.*");
$("ticks").innerHTML = Array.from({ length: 12 }, (_, i) => `<line x1="180" y1="4" x2="180" y2="0" stroke="#1b304c" stroke-width="4" transform="rotate(${i * 30} 180 180)"/>`).join("");
const STEPS = ["Vous configurez", "Vous payez", "Votre site existe"];
$("steps").innerHTML = STEPS.map((s, i) => `<div class="row step" id="stp${i}"><div class="num" id="num${i}">${i + 1}</div><span>${s}</span></div>`).join("");
$("globe").innerHTML = icon("globe", 36, "#7cc6fb", 2.2);
$("lockIc").innerHTML = icon("lock", 40, "#7cc6fb", 2.4);
$("okIc").innerHTML = icon("circle-check", 56, "#7cc6fb", 2.4);
words("s3t", "Simple à lancer.\n*Facile à garder.*");
// Ce que l'éditeur permet de modifier (novytek.fr/formules, étape 4)
const EDIT = [["type", "Textes"], ["palette", "Couleurs"], ["layout-grid", "Disposition"], ["menu", "Menu"], ["layers", "Sections"]];
$("s3c").innerHTML = EDIT.map(([ic, tx], i) => `<span class="chip" id="c3_${i}">${icon(ic, 40, "#7cc6fb", 2.2)}${tx}</span>`).join("");
const URL_TXT = "votre-entreprise.novytek.fr";

// ---------- Timeline (s) ----------
// 0.0–3.2  « Votre site en ligne dans la minute »
// 3.2–9.0  1 Vous configurez · 2 Vous payez · 3 Votre site existe
// 9.0–12.4 Vous le rendez vôtre, sans code, sans engagement
// 12.4–15  Carton de fin
setup({
  sweeps: [3.2, 9.0, 12.4], end: 12.4, cta: "Configurer votre site",
  pad: [["F2", "F3", "A3", "C4", "E4"], ["G2", "G3", "B3", "D4", "G4"], ["E2", "E3", "G3", "B3", "D4"], ["A2", "A3", "C4", "E4", "G4"]],
});

vo(0.2, 3.1, "Votre site en ligne… dans la minute ?");
vo(3.4, 5.1, "Vous configurez,");
vo(5.3, 6.9, "vous payez,");
vo(7.1, 8.8, "et votre site existe.");
vo(9.15, 12.3, "Simple à lancer… facile à garder.");
vo(12.6, 14.95, "Lancez-vous sur novytek.fr.");

const ST = [3.35, 5.2, 7.0], SEL = 3.9, TAP = 5.7, OK = 6.3, TYPE0 = 7.15, TYPE1 = 7.9, PAGE = 8.0, LIVE = 8.45;
for (let x = 0.3; x < 2.1; x += 0.1) sfx("tick", x, { gain: -27, pan: 0.5 * Math.sin(x * 3.3) });
sfx("bell", 2.12, { f: 1567.98, dur: 1.0, gain: -20 });
ST.forEach((x, i) => sfx("click", x, { f: 2200 + 200 * i, gain: -17, pan: -0.3 }));
sfx("click", SEL, { f: 2600, gain: -19, pan: 0.2 });
sfx("pop", SEL + 0.12, { f: 659.25, gain: -14, pan: 0.2 });
sfx("click", TAP, { f: 2600, gain: -18 });
sfx("blip", OK, { f: 1318.5, gain: -15 });
sfx("blip", OK + 0.12, { f: 1760, gain: -17 });
for (let k = 0; k < URL_TXT.length; k += 2) sfx("type", lerp(TYPE0, TYPE1, k / URL_TXT.length), { gain: -24, pan: 0.3 * Math.sin(k) });
sfx("pop", PAGE + 0.05, { f: 587.33, gain: -13 });
sfx("blip", LIVE, { f: 1174.66, gain: -18, pan: 0.4 });
EDIT.forEach((_, i) => sfx("pop", 9.6 + i * 0.14, { f: [523.25, 587.33, 659.25, 783.99, 880][i], gain: -14, pan: (i - 2) * 0.2 }));
sfx("click", 10.55, { f: 2800, gain: -19 });

window.renderFrame = function (t) {
  frameCommon(t);

  // 1
  scene("s1", t, 0, 3.25);
  inOut("ring", t, 0.05, 0.5, 2.9, 3.2, { dy: 60, s0: 0.6 });
  $("prog").setAttribute("stroke-dashoffset", String(100 * (1 - eIO(p(t, 0.3, 2.1)))));
  const done = Math.max(0, 1 - Math.abs(t - 2.15) / 0.2);
  if (t > 2.0) $("ring").style.transform += ` scale(${1 + 0.05 * done})`;
  wordsFrame("s1t", t, 0.4, 0.1, 2.9);
  inOut("s1c", t, 1.6, 2.0, 2.9, 3.2, { dy: 30 });

  // 2
  scene("s2", t, 3.2, 9.05);
  inOut("s2e", t, 3.3, 3.6, 8.7, 9.0, { dy: 30 });
  STEPS.forEach((_, i) => {
    inOut(`stp${i}`, t, 3.3 + i * 0.1, 3.65 + i * 0.1, 8.7 + i * 0.03, 9.0, { dx: -60, dy: 0, ox: -60, oy: 0 });
    const act = t >= ST[i] && (i === 2 || t < ST[i + 1]), done = i < 2 && t >= ST[i + 1];
    st(`stp${i}`, { background: act ? "rgba(27,140,227,.22)" : "transparent", borderColor: act ? "#1b8ce3" : "transparent", color: t >= ST[i] ? "#eef4fb" : "#9fb3cc" });
    st(`num${i}`, { background: done || act ? "#1b8ce3" : "var(--bg)", borderColor: done || act ? "#1b8ce3" : "var(--line)", color: done || act ? "#fff" : "#9fb3cc" });
    $(`num${i}`).innerHTML = done ? icon("circle-check", 40, "#fff", 2.6).replace(ICONS["circle-check"], '<path d="m6 12.5 4 4 8-9"/>') : String(i + 1);
  });
  inOut("card2", t, 3.45, 3.95, 8.7, 9.0, { dy: 140, oy: 100 });
  const pane = i => { const a = ST[i], b = i < 2 ? ST[i + 1] : 99; return clamp(p(t, a - 0.1, a + 0.15)) * (1 - clamp(p(t, b - 0.1, b + 0.1))); };
  [0, 1, 2].forEach(i => { const o = i === 0 ? (1 - clamp(p(t, ST[1] - 0.1, ST[1] + 0.1))) : pane(i); st(`pane${i}`, { opacity: o, transform: `translateX(${(1 - (i === 0 ? 1 : clamp(p(t, ST[i] - 0.1, ST[i] + 0.15)))) * 60}px)` }); });
  // Étape 1 : choix de la formule, le total s'affiche
  const sel = t >= SEL;
  st("o0", { borderColor: sel ? "#1b8ce3" : "var(--line)", background: sel ? "rgba(27,140,227,.16)" : "transparent" });
  st("o0", { transform: `scale(${1 - 0.03 * Math.max(0, 1 - Math.abs(t - SEL) / 0.1)})` });
  st($("o0").querySelector(".radio"), { borderColor: sel ? "#1b8ce3" : "#9fb3cc", background: sel ? "radial-gradient(circle, #1b8ce3 45%, transparent 50%)" : "transparent" });
  $("totv").textContent = sel ? "19 € /mois" : "— €";
  if (sel) st("totv", { transform: `scale(${1 + 0.12 * Math.max(0, 1 - Math.abs(t - SEL - 0.12) / 0.15)})`, transformOrigin: "right bottom" });
  // Étape 2 : paiement
  const busy = t >= TAP + 0.1 && t < OK, ok = t >= OK;
  st("pay", { transform: `scale(${1 - 0.06 * Math.max(0, 1 - Math.abs(t - TAP) / 0.1)})`, background: ok ? "#1b304c" : "var(--blue)" });
  $("payIn").innerHTML = busy ? '<span id="spin" style="display:block"></span>' : ok ? "Payé" : "Payer 19 €";
  if (busy) st("spin", { transform: `rotate(${(t - TAP) * 720}deg)` });
  inOut("ok", t, OK, OK + 0.3, 99, 100, { dy: 30, s0: 0.7 });
  // Étape 3 : l'adresse se tape, le site apparaît
  const nch = Math.floor(URL_TXT.length * p(t, TYPE0, TYPE1));
  $("urlt").textContent = URL_TXT.slice(0, nch);
  st("caret", { opacity: t < PAGE && Math.floor(t * 4) % 2 === 0 ? 1 : (t < TYPE1 ? 1 : 0) });
  [0, 1, 2, 3, 4, 5].forEach(i => { const k = p(t, PAGE + i * 0.06, PAGE + 0.3 + i * 0.06); st(`pg${i}`, { opacity: k, transform: `translateY(${(1 - eOut(k)) * 24}px)` }); });
  inOut("live", t, LIVE, LIVE + 0.25, 99, 100, { dy: -10, s0: 0.7 });
  if (t > LIVE) st($("live").querySelector("b"), { transform: `scale(${1 + 0.3 * Math.max(0, Math.sin((t - LIVE) * 7))})` });

  // 3
  scene("s3", t, 9.0, 12.45);
  wordsFrame("s3t", t, 9.15, 0.12, 12.1);
  EDIT.forEach((_, i) => inOut(`c3_${i}`, t, 9.6 + i * 0.14, 9.9 + i * 0.14, 12.05, 12.35, { dy: 30, s0: 0.6 }));
  inOut("s3a", t, 10.5, 10.9, 12.1, 12.4, { dy: 40 });
  inOut("s3b", t, 10.8, 11.2, 12.1, 12.4, { dy: 30 });
};
window.renderFrame(0);
</script>
</body>
</html>
